<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Takes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2b14b'/%3E%3Cpath d='M11 9l13 7-13 7z' fill='%23161412'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo">▶</span> Takes</div>
      <div class="top-actions">
        <button class="chip" id="ltx-status" data-action="refresh-ltx" title="Verificar o LTX Desktop">LTX…</button>
        <button class="chip" id="queue-status" data-action="open-queue">Fila vazia</button>
        <button class="chip settings-btn" data-action="open-settings" title="Chaves de API, modelos de IA e padrões de projeto">⚙ Configurações</button>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span>Projetos</span>
          <button class="icon-btn" data-action="new-project" title="Novo projeto">＋</button>
        </div>
        <nav id="project-list"></nav>
      </aside>
      <main id="main"></main>
    </div>
    <div id="modal-root"></div>
    <div id="toasts"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
